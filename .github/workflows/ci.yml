name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test Kotlin core and Ktor, build distribution
        run: ./gradlew --no-daemon :core:allTests :server:test :server:installDist
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen --dev
      - run: uv run playwright install --with-deps chromium
      - name: Test browser flows and Jenkins helper
        run: uv run pytest
