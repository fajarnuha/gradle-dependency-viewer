name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test Kotlin core, Ktor, and Gradle plugin
        run: ./gradlew --no-daemon :core:allTests :server:test :server:installDist :gradle-plugin:test
      - name: Test the staged Gradle plugin
        run: |
          set -eu
          version=$(sed -n 's/^version=//p' gradle.properties)
          repo="$RUNNER_TEMP/plugin-test-repository"
          consumer="$RUNNER_TEMP/plugin-test-consumer"
          ./gradlew --no-daemon :core:publishToMavenLocal :gradle-plugin:publishToMavenLocal "-Dmaven.repo.local=$repo"

          mkdir -p "$consumer"
          cat > "$consumer/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = uri(System.getenv("PLUGIN_TEST_REPOSITORY")) }
                  mavenCentral()
              }
          }
          rootProject.name = "plugin-test-consumer"
          EOF
          cat > "$consumer/build.gradle.kts" <<EOF
          plugins {
              java
              id("com.fajarnuha.dependency-graph") version "$version"
          }
          EOF
          PLUGIN_TEST_REPOSITORY="$repo" ./gradlew --no-daemon -p "$consumer" exportDependencyGraph
          test -s "$consumer/build/reports/dependency-graph/runtimeClasspath.json"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen --dev
      - run: uv run playwright install --with-deps chromium
      - name: Test browser flows and Jenkins helper
        run: uv run pytest
