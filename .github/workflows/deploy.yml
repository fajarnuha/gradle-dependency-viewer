name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version in gradle.properties to publish to Maven Central
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test release
        run: ./gradlew --no-daemon :core:jvmTest :server:test

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-maven-central:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check release version
        env:
          EXPECTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [[ "$EVENT_NAME" == push ]]; then
            version="v$version"
          fi
          if [[ -z "$EXPECTED_VERSION" || "$version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::The requested release does not match the version in gradle.properties."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test plugin release
        run: ./gradlew --no-daemon :core:jvmTest :gradle-plugin:test

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon publishAndReleaseToMavenCentral

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.actor }}
          REGISTRY: ghcr.io
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: GITHUB_TOKEN,USERNAME,REGISTRY
          script: |
            set -eu
            # Convert repository name to lowercase for Docker image
            IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # Use the tag that triggered the workflow
            TAG_NAME="${{ github.ref_name }}"
            FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}:${TAG_NAME}"

            echo "Deploying $FULL_IMAGE..."

            # Login to GHCR
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$USERNAME" --password-stdin

            # Pull the new image
            docker pull "$FULL_IMAGE"

            # Stop and remove existing container
            docker stop gradle-dependency-viewer || true
            docker rm gradle-dependency-viewer || true

            # Run new container
            docker run -d \
              --name gradle-dependency-viewer \
              --restart unless-stopped \
              -e PORT=8000 \
              -p 8000:8000 \
              "$FULL_IMAGE"

            # Fail deployment if the new process never becomes ready.
            for attempt in $(seq 1 30); do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' gradle-dependency-viewer)
              if [ "$STATUS" = healthy ]; then
                break
              fi
              sleep 2
            done
            if [ "$STATUS" != healthy ]; then
              docker logs gradle-dependency-viewer
              exit 1
            fi

            # Optional: Prune unused images to save space
            docker image prune -f
